<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>BLE DPV 曲线绘图器</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7f8;
      --surface: #ffffff;
      --text: #172126;
      --muted: #617079;
      --line: #d7e0e4;
      --primary: #0f766e;
      --primary-strong: #0a5d57;
      --primary-soft: #dff3f0;
      --danger: #b42318;
      --shadow: 0 8px 30px rgba(21, 46, 56, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1417;
        --surface: #151f23;
        --text: #edf4f6;
        --muted: #a6b5bb;
        --line: #334249;
        --primary: #38b2a6;
        --primary-strong: #63c9bf;
        --primary-soft: #183d3a;
        --danger: #ff8b82;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 2rem);
      font-weight: 700;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.connected { color: var(--primary-strong); }
    .status.connected .status-dot { background: var(--primary); }
    .status.error { color: var(--danger); }
    .status.error .status-dot { background: var(--danger); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
    }

    button {
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
      font-weight: 650;
    }

    button.stop {
      border-color: #b42318;
      color: #b42318;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .message {
      flex: 1 1 240px;
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      overflow-wrap: anywhere;
    }

    .message.error { color: var(--danger); }

    .parameter-status {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .parameter-status.error { color: var(--danger); }

    details {
      margin-top: 11px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    summary { color: var(--muted); cursor: pointer; }

    .uuid-grid, .axis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 11px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 0.83rem;
    }

    input {
      width: 100%;
      min-height: 41px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      background: var(--page);
      color: var(--text);
    }

    input:focus {
      outline: 3px solid var(--primary-soft);
      border-color: var(--primary);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 12px;
    }

    .stat {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .stat-value {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(1.05rem, 4vw, 1.35rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .chart-panel { padding: 12px 10px 8px; }

    .chart-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 0 4px 8px;
    }

    .chart-heading h2 { margin: 0; font-size: 1rem; }
    .chart-heading span { color: var(--muted); font-size: 0.8rem; }

    .canvas-wrap {
      position: relative;
      width: 100%;
      height: clamp(300px, 58vw, 520px);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .axis-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .footer-note {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    @media (max-width: 620px) {
      header { align-items: stretch; flex-direction: column; }
      .status { align-self: flex-start; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .uuid-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>BLE DPV 曲线绘图器</h1>
        <p class="subtitle">9字节数据帧 · 小端序 · 实时绘图</p>
      </div>
      <div id="status" class="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <section class="panel" aria-label="蓝牙连接">
      <div class="toolbar">
        <button id="connectButton" class="primary" type="button">连接 BLE</button>
        <button id="disconnectButton" type="button" disabled>断开</button>
        <button id="startButton" class="primary" type="button" disabled>开始检测</button>
        <button id="stopButton" class="stop" type="button" disabled>停止检测</button>
        <button id="clearButton" type="button">清空曲线</button>
        <p id="message" class="message">请使用安卓 Chrome，并通过 HTTPS 打开本页。</p>
      </div>
      <details>
        <summary>BLE UUID 设置</summary>
        <div class="uuid-grid">
          <label>服务 UUID
            <input id="serviceUuid" type="text" value="0000ffe0-0000-1000-8000-00805f9b34fb" autocomplete="off" spellcheck="false">
          </label>
          <label>通知特征 UUID
            <input id="characteristicUuid" type="text" value="0000ffe1-0000-1000-8000-00805f9b34fb" autocomplete="off" spellcheck="false">
          </label>
          <label>控制特征 UUID（留空则同通知特征）
            <input id="controlCharacteristicUuid" type="text" value="" autocomplete="off" spellcheck="false">
          </label>
        </div>
      </details>
    </section>

    <section class="panel" aria-label="DPV扫描参数">
      <p class="axis-title">DPV扫描范围（单位：mV）</p>
      <div class="axis-grid">
        <label>起始电位 RampStartVolt
          <input id="rampStart" type="number" value="-400" min="-800" max="1199" step="1" inputmode="numeric">
        </label>
        <label>终止电位 RampPeakVolt
          <input id="rampPeak" type="number" value="600" min="-799" max="1200" step="1" inputmode="numeric">
        </label>
      </div>
      <div class="toolbar" style="margin-top: 11px">
        <button id="refreshRangeButton" type="button" disabled>读取当前参数</button>
        <button id="applyRangeButton" class="primary" type="button" disabled>应用扫描范围</button>
      </div>
      <p id="parameterStatus" class="parameter-status">连接后将自动读取STM32中的当前参数。</p>
    </section>

    <section class="stats" aria-label="实时数据">
      <div class="stat"><span class="stat-label">最新 point</span><strong id="pointValue" class="stat-value">—</strong></div>
      <div class="stat"><span class="stat-label">最新 current</span><strong id="currentValue" class="stat-value">—</strong></div>
      <div class="stat"><span class="stat-label">有效数据包</span><strong id="validValue" class="stat-value">0</strong></div>
      <div class="stat"><span class="stat-label">错误数据包</span><strong id="errorValue" class="stat-value">0</strong></div>
    </section>

    <section class="panel chart-panel">
      <div class="chart-heading">
        <h2>差分电流曲线</h2>
        <span id="pointCount">0 个绘图点</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="chart" role="img" aria-label="横轴为DPV点编号、纵轴为差分电流的实时曲线图"></canvas>
      </div>
    </section>

    <section class="panel" aria-label="坐标轴范围">
      <p class="axis-title">坐标轴范围（X轴和Y轴分别设置）</p>
      <div class="axis-grid">
        <label>X轴下限
          <input id="xMin" type="number" value="0" step="1" inputmode="numeric">
        </label>
        <label>X轴上限
          <input id="xMax" type="number" value="100" step="1" inputmode="numeric">
        </label>
        <label>Y轴下限（nA）
          <input id="yMin" type="number" value="-3000" step="1" inputmode="numeric">
        </label>
        <label>Y轴上限（nA）
          <input id="yMax" type="number" value="3000" step="1" inputmode="numeric">
        </label>
      </div>
      <p class="footer-note">数据帧：A5固定9字节；命令与响应帧：A6不定长、序列号、CRC16-CCITT及超时重传。</p>
    </section>
  </main>

  <script>
    'use strict';

    const DATA_FRAME_LENGTH = 9;
    const DATA_FRAME_HEAD = 0xA5;
    const PROTOCOL_FRAME_HEAD = 0xA6;
    const FRAME_TAIL = 0x5A;
    const FRAME_TYPE_REQUEST = 0x01;
    const FRAME_TYPE_RESPONSE = 0x02;
    const MAX_PROTOCOL_PAYLOAD = 32;
    const MAX_PLOT_POINTS = 5000;
    const COMMAND_START = 0x01;
    const COMMAND_STOP = 0x02;
    const COMMAND_SET_SCAN_RANGE = 0x10;
    const COMMAND_GET_SCAN_RANGE = 0x11;
    const REQUEST_TIMEOUT_MS = 800;
    const MAX_REQUEST_RETRIES = 2;
    const STATUS_OK = 0x00;

    const elements = {
      status: document.getElementById('status'),
      statusText: document.getElementById('statusText'),
      message: document.getElementById('message'),
      connectButton: document.getElementById('connectButton'),
      disconnectButton: document.getElementById('disconnectButton'),
      startButton: document.getElementById('startButton'),
      stopButton: document.getElementById('stopButton'),
      clearButton: document.getElementById('clearButton'),
      serviceUuid: document.getElementById('serviceUuid'),
      characteristicUuid: document.getElementById('characteristicUuid'),
      controlCharacteristicUuid: document.getElementById('controlCharacteristicUuid'),
      rampStart: document.getElementById('rampStart'),
      rampPeak: document.getElementById('rampPeak'),
      refreshRangeButton: document.getElementById('refreshRangeButton'),
      applyRangeButton: document.getElementById('applyRangeButton'),
      parameterStatus: document.getElementById('parameterStatus'),
      pointValue: document.getElementById('pointValue'),
      currentValue: document.getElementById('currentValue'),
      validValue: document.getElementById('validValue'),
      errorValue: document.getElementById('errorValue'),
      pointCount: document.getElementById('pointCount'),
      xMin: document.getElementById('xMin'),
      xMax: document.getElementById('xMax'),
      yMin: document.getElementById('yMin'),
      yMax: document.getElementById('yMax'),
      canvas: document.getElementById('chart')
    };

    const context = elements.canvas.getContext('2d');
    let bluetoothDevice = null;
    let notifyCharacteristic = null;
    let controlCharacteristic = null;
    let receiveBuffer = new Uint8Array(0);
    let plotData = [];
    let validFrames = 0;
    let errorFrames = 0;
    let sequenceCounter = window.crypto && window.crypto.getRandomValues
      ? window.crypto.getRandomValues(new Uint8Array(1))[0]
      : Date.now() & 0xFF;
    let pendingRequest = null;
    let measurementRunning = false;

    function setStatus(kind, text) {
      elements.status.className = `status ${kind || ''}`.trim();
      elements.statusText.textContent = text;
    }

    function setMessage(text, isError = false) {
      elements.message.textContent = text;
      elements.message.classList.toggle('error', isError);
    }

    function normalizeUuid(value) {
      return value.trim().toLowerCase();
    }

    function setParameterStatus(text, isError = false) {
      elements.parameterStatus.textContent = text;
      elements.parameterStatus.classList.toggle('error', isError);
    }

    function setControlButtons(enabled) {
      elements.startButton.disabled = !enabled;
      elements.stopButton.disabled = !enabled;
      elements.refreshRangeButton.disabled = !enabled;
      elements.applyRangeButton.disabled = !enabled;
      elements.rampStart.disabled = !enabled;
      elements.rampPeak.disabled = !enabled;
    }

    function crc16Ccitt(data) {
      let crc = 0xFFFF;

      for (const value of data) {
        crc ^= value << 8;
        for (let bit = 0; bit < 8; bit += 1) {
          crc = crc & 0x8000
            ? ((crc << 1) ^ 0x1021) & 0xFFFF
            : (crc << 1) & 0xFFFF;
        }
      }

      return crc;
    }

    function buildRequestFrame(sequence, command, payload = new Uint8Array(0)) {
      if (payload.length > MAX_PROTOCOL_PAYLOAD) {
        throw new Error('命令数据过长');
      }

      const frame = new Uint8Array(payload.length + 8);
      frame[0] = PROTOCOL_FRAME_HEAD;
      frame[1] = FRAME_TYPE_REQUEST;
      frame[2] = sequence;
      frame[3] = command;
      frame[4] = payload.length;
      frame.set(payload, 5);

      const crcIndex = 5 + payload.length;
      const crc = crc16Ccitt(frame.subarray(1, crcIndex));
      frame[crcIndex] = crc & 0xFF;
      frame[crcIndex + 1] = (crc >> 8) & 0xFF;
      frame[crcIndex + 2] = FRAME_TAIL;
      return frame;
    }

    function statusText(status) {
      const names = {
        0x00: '成功',
        0x01: '未知命令',
        0x02: '数据长度错误',
        0x03: '参数无效',
        0x04: '设备正在测量',
        0x05: '当前状态不允许执行',
        0x06: 'STM32内部执行错误',
        0x07: '协议版本不支持'
      };
      return names[status] || `未知状态 0x${status.toString(16).padStart(2, '0')}`;
    }

    async function writeControlFrame(frame) {
      if (!controlCharacteristic) {
        throw new Error('BLE 尚未连接');
      }

      if (controlCharacteristic.properties.writeWithoutResponse
        && typeof controlCharacteristic.writeValueWithoutResponse === 'function') {
        await controlCharacteristic.writeValueWithoutResponse(frame);
      } else if (controlCharacteristic.properties.write
        && typeof controlCharacteristic.writeValueWithResponse === 'function') {
        await controlCharacteristic.writeValueWithResponse(frame);
      } else if (typeof controlCharacteristic.writeValue === 'function') {
        await controlCharacteristic.writeValue(frame);
      } else {
        throw new Error('控制特征不支持写入');
      }
    }

    function rejectPendingRequest(error) {
      if (!pendingRequest) return;
      const request = pendingRequest;
      pendingRequest = null;
      clearTimeout(request.timer);
      request.reject(error);
    }

    async function transmitPendingRequest(request) {
      try {
        await writeControlFrame(request.frame);
        if (pendingRequest === request) {
          clearTimeout(request.timer);
          request.timer = setTimeout(() => {
            if (pendingRequest !== request) return;
            if (request.retries < MAX_REQUEST_RETRIES) {
              request.retries += 1;
              transmitPendingRequest(request);
            } else {
              const error = new Error(`命令应答超时，已重试${MAX_REQUEST_RETRIES}次`);
              rejectPendingRequest(error);
            }
          }, REQUEST_TIMEOUT_MS);
        }
      } catch (error) {
        if (pendingRequest === request) {
          rejectPendingRequest(error);
        }
      }
    }

    function sendProtocolCommand(command, payload = new Uint8Array(0)) {
      if (pendingRequest) {
        return Promise.reject(new Error('上一条命令仍在等待应答'));
      }

      sequenceCounter = (sequenceCounter + 1) & 0xFF;
      const sequence = sequenceCounter;
      const frame = buildRequestFrame(sequence, command, payload);

      return new Promise((resolve, reject) => {
        const request = {
          sequence,
          command,
          frame,
          retries: 0,
          timer: null,
          resolve,
          reject
        };
        pendingRequest = request;
        transmitPendingRequest(request);
      });
    }

    async function connectBle() {
      if (!window.isSecureContext) {
        setStatus('error', '环境不安全');
        setMessage('Web Bluetooth 要求 HTTPS；请勿直接用 file:// 打开。', true);
        return;
      }
      if (!navigator.bluetooth) {
        setStatus('error', '浏览器不支持');
        setMessage('当前浏览器不支持 Web Bluetooth，请使用安卓 Chrome。', true);
        return;
      }

      const serviceUuid = normalizeUuid(elements.serviceUuid.value);
      const characteristicUuid = normalizeUuid(elements.characteristicUuid.value);
      const controlUuid = normalizeUuid(elements.controlCharacteristicUuid.value) || characteristicUuid;
      if (!serviceUuid || !characteristicUuid) {
        setMessage('请填写服务 UUID 和通知特征 UUID。', true);
        return;
      }

      try {
        elements.connectButton.disabled = true;
        setStatus('', '选择设备…');
        setMessage('请在系统设备列表中选择你的 BLE 模块。');

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [serviceUuid]
        });
        bluetoothDevice.addEventListener('gattserverdisconnected', handleDisconnected);

        setStatus('', '正在连接…');
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(serviceUuid);
        notifyCharacteristic = await service.getCharacteristic(characteristicUuid);
        await notifyCharacteristic.startNotifications();
        notifyCharacteristic.addEventListener('characteristicvaluechanged', handleNotification);
        controlCharacteristic = controlUuid === characteristicUuid
          ? notifyCharacteristic
          : await service.getCharacteristic(controlUuid);

        if (!controlCharacteristic.properties.write
          && !controlCharacteristic.properties.writeWithoutResponse) {
          throw new Error('控制特征不支持写入');
        }

        receiveBuffer = new Uint8Array(0);
        measurementRunning = false;
        elements.disconnectButton.disabled = false;
        setControlButtons(true);
        setStatus('connected', '已连接');
        setMessage(`已连接：${bluetoothDevice.name || '未命名设备'}，请点击“开始检测”。`);

        try {
          await getScanRange();
        } catch (error) {
          setParameterStatus(`自动读取参数失败：${error.message || error}`, true);
        }
      } catch (error) {
        elements.connectButton.disabled = false;
        elements.disconnectButton.disabled = true;
        setControlButtons(false);
        setStatus('error', '连接失败');
        setMessage(`连接失败：${error.message || error}`, true);
      }
    }

    function disconnectBle() {
      if (notifyCharacteristic) {
        notifyCharacteristic.removeEventListener('characteristicvaluechanged', handleNotification);
      }
      if (bluetoothDevice && bluetoothDevice.gatt && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      } else {
        handleDisconnected();
      }
    }

    function handleDisconnected() {
      rejectPendingRequest(new Error('BLE连接已断开'));
      notifyCharacteristic = null;
      controlCharacteristic = null;
      receiveBuffer = new Uint8Array(0);
      measurementRunning = false;
      elements.connectButton.disabled = false;
      elements.disconnectButton.disabled = true;
      setControlButtons(false);
      setStatus('', '未连接');
      setMessage('BLE 已断开，可重新连接。');
      setParameterStatus('连接后将自动读取STM32中的当前参数。');
    }

    async function startMeasurement() {
      try {
        elements.startButton.disabled = true;
        const response = await sendProtocolCommand(COMMAND_START);
        measurementRunning = response.data[0] === 0x01;
        clearChart();
        setMessage('STM32已确认开始检测，正在等待DPV数据。');
      } catch (error) {
        if (error.data && error.data[0] === 0x01) {
          measurementRunning = true;
        }
        setMessage(`开始失败：${error.message || error}`, true);
      } finally {
        setControlButtons(Boolean(controlCharacteristic));
      }
    }

    async function stopMeasurement() {
      try {
        elements.stopButton.disabled = true;
        await sendProtocolCommand(COMMAND_STOP);
        measurementRunning = false;
        setMessage('STM32已确认停止检测。');
      } catch (error) {
        setMessage(`停止失败：${error.message || error}`, true);
      } finally {
        setControlButtons(Boolean(controlCharacteristic));
      }
    }

    function parseRangeResponse(data) {
      if (data.length !== 4) {
        throw new Error('扫描范围响应长度错误');
      }

      const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
      return {
        start: view.getInt16(0, true),
        peak: view.getInt16(2, true)
      };
    }

    async function getScanRange() {
      elements.refreshRangeButton.disabled = true;
      setParameterStatus('正在读取STM32参数…');

      try {
        const response = await sendProtocolCommand(COMMAND_GET_SCAN_RANGE);
        const range = parseRangeResponse(response.data);
        elements.rampStart.value = String(range.start);
        elements.rampPeak.value = String(range.peak);
        setParameterStatus(`当前扫描范围：${range.start} mV ～ ${range.peak} mV`);
        return range;
      } finally {
        setControlButtons(Boolean(controlCharacteristic));
      }
    }

    async function setScanRange() {
      const start = Number(elements.rampStart.value);
      const peak = Number(elements.rampPeak.value);

      if (!Number.isInteger(start) || !Number.isInteger(peak)) {
        setParameterStatus('起始和终止电位必须是整数mV。', true);
        return;
      }
      if (start < -800 || peak > 1200 || start >= peak || (peak - start) % 10 !== 0) {
        setParameterStatus('范围须满足-800 ≤ 起始 < 终止 ≤ 1200 mV，且跨度为10 mV的整数倍。', true);
        return;
      }

      const payload = new Uint8Array(4);
      const view = new DataView(payload.buffer);
      view.setInt16(0, start, true);
      view.setInt16(2, peak, true);

      elements.applyRangeButton.disabled = true;
      setParameterStatus('正在设置扫描范围…');

      try {
        const response = await sendProtocolCommand(COMMAND_SET_SCAN_RANGE, payload);
        const range = parseRangeResponse(response.data);
        elements.rampStart.value = String(range.start);
        elements.rampPeak.value = String(range.peak);
        setParameterStatus(`设置成功：${range.start} mV ～ ${range.peak} mV`);
      } catch (error) {
        setParameterStatus(`设置失败：${error.message || error}`, true);
      } finally {
        setControlButtons(Boolean(controlCharacteristic));
      }
    }

    function handleNotification(event) {
      const value = event.target.value;
      const chunk = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
      appendAndParse(chunk);
    }

    function handleProtocolResponse(frame) {
      const sequence = frame[2];
      const command = frame[3];
      const payloadLength = frame[4];
      const payload = frame.slice(5, 5 + payloadLength);

      if (frame[1] !== FRAME_TYPE_RESPONSE || payload.length < 1) {
        errorFrames += 1;
        updateCounters();
        return;
      }

      if (!pendingRequest
        || pendingRequest.sequence !== sequence
        || pendingRequest.command !== command) {
        return;
      }

      const request = pendingRequest;
      pendingRequest = null;
      clearTimeout(request.timer);

      const status = payload[0];
      const data = payload.slice(1);

      if (status === STATUS_OK) {
        request.resolve({ sequence, command, status, data });
      } else {
        const error = new Error(statusText(status));
        error.status = status;
        error.data = data;
        request.reject(error);
      }
    }

    function appendAndParse(chunk) {
      const combined = new Uint8Array(receiveBuffer.length + chunk.length);
      combined.set(receiveBuffer, 0);
      combined.set(chunk, receiveBuffer.length);
      receiveBuffer = combined;

      while (receiveBuffer.length > 0) {
        const dataHeadIndex = receiveBuffer.indexOf(DATA_FRAME_HEAD);
        const protocolHeadIndex = receiveBuffer.indexOf(PROTOCOL_FRAME_HEAD);
        let headIndex;

        if (dataHeadIndex < 0) {
          headIndex = protocolHeadIndex;
        } else if (protocolHeadIndex < 0) {
          headIndex = dataHeadIndex;
        } else {
          headIndex = Math.min(dataHeadIndex, protocolHeadIndex);
        }

        if (headIndex < 0) {
          receiveBuffer = new Uint8Array(0);
          return;
        }
        if (headIndex > 0) {
          receiveBuffer = receiveBuffer.slice(headIndex);
        }

        if (receiveBuffer[0] === DATA_FRAME_HEAD) {
          if (receiveBuffer.length < DATA_FRAME_LENGTH) return;

          if (receiveBuffer[DATA_FRAME_LENGTH - 1] !== FRAME_TAIL) {
            errorFrames += 1;
            receiveBuffer = receiveBuffer.slice(1);
            updateCounters();
            continue;
          }

          const frame = receiveBuffer.slice(0, DATA_FRAME_LENGTH);
          receiveBuffer = receiveBuffer.slice(DATA_FRAME_LENGTH);

          let checksum = 0;
          for (let index = 1; index <= 6; index += 1) {
            checksum = (checksum + frame[index]) & 0xFF;
          }

          if (checksum !== frame[7]) {
            errorFrames += 1;
            updateCounters();
            continue;
          }

          const view = new DataView(frame.buffer, frame.byteOffset, frame.byteLength);
          const point = view.getUint16(1, true);
          const current = view.getInt32(3, true);
          acceptDataPoint(point, current);
          continue;
        }

        if (receiveBuffer.length < 5) return;

        const payloadLength = receiveBuffer[4];
        if (payloadLength > MAX_PROTOCOL_PAYLOAD) {
          errorFrames += 1;
          receiveBuffer = receiveBuffer.slice(1);
          updateCounters();
          continue;
        }

        const protocolLength = payloadLength + 8;
        if (receiveBuffer.length < protocolLength) return;

        if (receiveBuffer[protocolLength - 1] !== FRAME_TAIL) {
          errorFrames += 1;
          receiveBuffer = receiveBuffer.slice(1);
          updateCounters();
          continue;
        }

        const frame = receiveBuffer.slice(0, protocolLength);
        receiveBuffer = receiveBuffer.slice(protocolLength);
        const crcIndex = 5 + payloadLength;
        const receivedCrc = frame[crcIndex] | (frame[crcIndex + 1] << 8);
        const calculatedCrc = crc16Ccitt(frame.subarray(1, crcIndex));

        if (receivedCrc !== calculatedCrc) {
          errorFrames += 1;
          updateCounters();
          continue;
        }

        handleProtocolResponse(frame);
      }
    }

    function acceptDataPoint(point, current) {
      validFrames += 1;
      plotData.push({ point, current });
      if (plotData.length > MAX_PLOT_POINTS) {
        plotData.splice(0, plotData.length - MAX_PLOT_POINTS);
      }

      elements.pointValue.textContent = String(point);
      elements.currentValue.textContent = `${current} nA`;
      updateCounters();
      drawChart();
    }

    function updateCounters() {
      elements.validValue.textContent = String(validFrames);
      elements.errorValue.textContent = String(errorFrames);
      elements.pointCount.textContent = `${plotData.length} 个绘图点`;
    }

    function clearChart() {
      plotData = [];
      validFrames = 0;
      errorFrames = 0;
      elements.pointValue.textContent = '—';
      elements.currentValue.textContent = '—';
      updateCounters();
      drawChart();
    }

    function readDomain() {
      const domain = {
        xMin: Number(elements.xMin.value),
        xMax: Number(elements.xMax.value),
        yMin: Number(elements.yMin.value),
        yMax: Number(elements.yMax.value)
      };
      const valid = Object.values(domain).every(Number.isFinite)
        && domain.xMax > domain.xMin
        && domain.yMax > domain.yMin;
      return valid ? domain : null;
    }

    function themeColor(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function formatTick(value) {
      const magnitude = Math.abs(value);
      if (magnitude >= 1000000) return `${(value / 1000000).toFixed(1)}M`;
      if (magnitude >= 10000) return `${(value / 1000).toFixed(0)}k`;
      return Number.isInteger(value) ? String(value) : value.toFixed(1);
    }

    function drawChart() {
      const bounds = elements.canvas.getBoundingClientRect();
      if (bounds.width <= 0 || bounds.height <= 0) return;

      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.round(bounds.width);
      const height = Math.round(bounds.height);
      const targetWidth = Math.round(width * dpr);
      const targetHeight = Math.round(height * dpr);
      if (elements.canvas.width !== targetWidth || elements.canvas.height !== targetHeight) {
        elements.canvas.width = targetWidth;
        elements.canvas.height = targetHeight;
      }

      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      context.clearRect(0, 0, width, height);

      const colors = {
        text: themeColor('--text'),
        muted: themeColor('--muted'),
        line: themeColor('--line'),
        surface: themeColor('--surface'),
        primary: themeColor('--primary')
      };
      const margin = { left: width < 430 ? 58 : 70, right: 14, top: 16, bottom: 48 };
      const plotWidth = Math.max(1, width - margin.left - margin.right);
      const plotHeight = Math.max(1, height - margin.top - margin.bottom);
      const domain = readDomain();

      context.fillStyle = colors.surface;
      context.fillRect(margin.left, margin.top, plotWidth, plotHeight);
      context.font = '12px system-ui, sans-serif';
      context.lineWidth = 1;

      if (!domain) {
        context.fillStyle = colors.muted;
        context.textAlign = 'center';
        context.fillText('坐标轴上限必须大于下限', width / 2, height / 2);
        return;
      }

      const xToPixel = value => margin.left + ((value - domain.xMin) / (domain.xMax - domain.xMin)) * plotWidth;
      const yToPixel = value => margin.top + plotHeight - ((value - domain.yMin) / (domain.yMax - domain.yMin)) * plotHeight;
      const tickCount = width < 430 ? 4 : 5;

      context.strokeStyle = colors.line;
      context.fillStyle = colors.muted;
      for (let index = 0; index <= tickCount; index += 1) {
        const fraction = index / tickCount;
        const x = margin.left + fraction * plotWidth;
        const y = margin.top + fraction * plotHeight;

        context.beginPath();
        context.moveTo(x, margin.top);
        context.lineTo(x, margin.top + plotHeight);
        context.stroke();
        context.textAlign = 'center';
        context.textBaseline = 'top';
        context.fillText(formatTick(domain.xMin + fraction * (domain.xMax - domain.xMin)), x, margin.top + plotHeight + 8);

        context.beginPath();
        context.moveTo(margin.left, y);
        context.lineTo(margin.left + plotWidth, y);
        context.stroke();
        context.textAlign = 'right';
        context.textBaseline = 'middle';
        context.fillText(formatTick(domain.yMax - fraction * (domain.yMax - domain.yMin)), margin.left - 8, y);
      }

      context.strokeStyle = colors.text;
      context.strokeRect(margin.left, margin.top, plotWidth, plotHeight);
      context.fillStyle = colors.text;
      context.textAlign = 'center';
      context.textBaseline = 'bottom';
      context.fillText('DPV 点编号', margin.left + plotWidth / 2, height - 2);

      context.save();
      context.translate(13, margin.top + plotHeight / 2);
      context.rotate(-Math.PI / 2);
      context.textBaseline = 'top';
      context.fillText('差分电流 (nA)', 0, 0);
      context.restore();

      if (plotData.length === 0) {
        context.fillStyle = colors.muted;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText('连接 BLE 后等待数据', margin.left + plotWidth / 2, margin.top + plotHeight / 2);
        return;
      }

      context.save();
      context.beginPath();
      context.rect(margin.left, margin.top, plotWidth, plotHeight);
      context.clip();
      context.beginPath();
      let drawing = false;
      for (const sample of plotData) {
        if (sample.point < domain.xMin || sample.point > domain.xMax
          || sample.current < domain.yMin || sample.current > domain.yMax) {
          drawing = false;
          continue;
        }
        const x = xToPixel(sample.point);
        const y = yToPixel(sample.current);
        if (!drawing) {
          context.moveTo(x, y);
          drawing = true;
        } else {
          context.lineTo(x, y);
        }
      }
      context.strokeStyle = colors.primary;
      context.lineWidth = 2;
      context.lineJoin = 'round';
      context.lineCap = 'round';
      context.stroke();

      const latest = plotData[plotData.length - 1];
      if (latest.point >= domain.xMin && latest.point <= domain.xMax
        && latest.current >= domain.yMin && latest.current <= domain.yMax) {
        context.beginPath();
        context.arc(xToPixel(latest.point), yToPixel(latest.current), 3.5, 0, Math.PI * 2);
        context.fillStyle = colors.primary;
        context.fill();
      }
      context.restore();
    }

    elements.connectButton.addEventListener('click', connectBle);
    elements.disconnectButton.addEventListener('click', disconnectBle);
    elements.startButton.addEventListener('click', startMeasurement);
    elements.stopButton.addEventListener('click', stopMeasurement);
    elements.refreshRangeButton.addEventListener('click', async () => {
      try {
        await getScanRange();
      } catch (error) {
        setParameterStatus(`读取失败：${error.message || error}`, true);
      }
    });
    elements.applyRangeButton.addEventListener('click', setScanRange);
    elements.clearButton.addEventListener('click', clearChart);
    [elements.xMin, elements.xMax, elements.yMin, elements.yMax]
      .forEach(input => input.addEventListener('input', drawChart));

    const resizeObserver = new ResizeObserver(drawChart);
    resizeObserver.observe(elements.canvas.parentElement);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawChart);

    if (!window.isSecureContext) {
      setStatus('error', '需要 HTTPS');
      setMessage('请将网页部署到 HTTPS 地址后再使用蓝牙功能。', true);
    } else if (!navigator.bluetooth) {
      setStatus('error', '浏览器不支持');
      setMessage('请使用支持 Web Bluetooth 的安卓 Chrome。', true);
    }
    drawChart();
  </script>
</body>
</html>
